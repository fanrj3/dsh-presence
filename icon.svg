<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Presence">
  <defs>
    <linearGradient id="presence-tile" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5b9bff" />
      <stop offset="1" stop-color="#2f6bff" />
    </linearGradient>
    <linearGradient id="presence-sheen" x1="32" y1="2" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.34" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect width="64" height="64" rx="16" fill="url(#presence-tile)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.16" />
  <rect x="1" y="1" width="62" height="31" rx="15" fill="url(#presence-sheen)" />

  <!-- terminal window: the remote shell Presence gives the agent -->
  <rect x="14" y="18" width="36" height="26" rx="6.5"
        fill="#0b1533" fill-opacity="0.24"
        stroke="#ffffff" stroke-opacity="0.92" stroke-width="2.6" />
  <path d="M21.5 26.5l4.4 4.4-4.4 4.4" fill="none" stroke="#ffffff" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round" />
  <path d="M30 35.3h9.5" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" />

  <!-- live connection pulse -->
  <circle cx="46.5" cy="46.5" r="4.6" fill="#3ddc84" stroke="#0b1533" stroke-opacity="0.32" stroke-width="1.6" />
  <path d="M41.4 52.1a7.9 7.9 0 0 1 0-11.8" fill="none" stroke="#3ddc84" stroke-width="2.5"
        stroke-linecap="round" opacity="0.9" />
</svg>
